<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Activity - ReyCloudShop</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box
}

body{
min-height:100vh;
background:
radial-gradient(circle at 10% 10%,rgba(0,217,255,.1),transparent 30%),
radial-gradient(circle at 90% 90%,rgba(157,92,255,.1),transparent 30%),
#05070b;
font-family:Arial,sans-serif;
color:#fff
}

.app{
width:100%;
max-width:760px;
margin:auto;
padding:25px 18px 40px
}

.top{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:25px
}

.brand small{
color:#687181;
font-size:10px;
letter-spacing:3px
}

.brand h1{
font-size:30px;
margin-top:7px
}

.back{
width:48px;
height:48px;
border:1px solid rgba(255,255,255,.08);
border-radius:16px;
background:rgba(255,255,255,.04);
color:white;
font-size:22px
}

.card{
border:1px solid rgba(255,255,255,.08);
background:rgba(12,17,25,.9);
border-radius:27px;
padding:20px;
box-shadow:0 25px 70px rgba(0,0,0,.4)
}

.item{
padding:18px;
border:1px solid rgba(255,255,255,.07);
background:rgba(255,255,255,.025);
border-radius:20px;
margin-bottom:13px
}

.item:last-child{
margin-bottom:0
}

.meta{
display:flex;
justify-content:space-between;
gap:10px;
margin-bottom:10px
}

.badge{
font-size:10px;
padding:6px 9px;
border-radius:8px;
background:rgba(0,217,255,.1);
color:#00d9ff;
text-transform:uppercase
}

.date{
font-size:10px;
color:#697384
}

.title{
font-size:17px;
font-weight:800;
margin-bottom:7px
}

.desc{
font-size:13px;
line-height:1.6;
color:#9ca5b4
}

.version{
display:inline-block;
margin-top:12px;
font-size:10px;
color:#9d5cff
}

.empty{
text-align:center;
padding:45px 15px;
color:#697384
}

.loading{
text-align:center;
padding:35px;
color:#697384
}

.footer{
text-align:center;
margin-top:20px;
font-size:9px;
letter-spacing:2px;
color:#343b47
}
</style>
</head>

<body>

<div class="app">

<div class="top">

<div class="brand">
<small>REYCLOUDSHOP</small>
<h1>Activity</h1>
</div>

<button class="back" onclick="history.back()">←</button>

</div>

<div class="card" id="activityList">

<div class="loading">
Memuat pembaruan...
</div>

</div>

<div class="footer">
POWERED BY REYCLOUDSHOP
</div>

</div>

<script>
const activityList =
document.getElementById("activityList");

function escapeHTML(value){
return String(value || "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");
}

function render(data){

if(!data.success || !data.activities?.length){

activityList.innerHTML=`
<div class="empty">
Belum ada pembaruan.
</div>
`;

return;
}

activityList.innerHTML=data.activities.map(item=>`

<div class="item">

<div class="meta">

<div class="badge">
${escapeHTML(item.type)}
</div>

<div class="date">
${escapeHTML(item.date)}
${item.time ? " · "+escapeHTML(item.time) : ""}
</div>

</div>

<div class="title">
${escapeHTML(item.title)}
</div>

<div class="desc">
${escapeHTML(item.description)}
</div>

${item.version ? `
<div class="version">
VERSION ${escapeHTML(item.version)}
</div>
` : ""}

</div>

`).join("");
}

async function loadActivity(){

try{

const response =
await fetch("/api/activity",{
cache:"no-store"
});

const data =
await response.json();

if(!response.ok){
throw new Error(data.error);
}

render(data);

}catch(error){

activityList.innerHTML=`
<div class="empty">
Gagal memuat activity.
</div>
`;

console.error(error);

}

}

loadActivity();
</script>

</body>
</html>
