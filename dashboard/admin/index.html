<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ReyCloudShop — Admin Control</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent
}

:root{
--bg:#05070b;
--card:#0c1119;
--line:rgba(255,255,255,.08);
--muted:#747d8d;
--text:#f5f7fb;
--cyan:#00d9ff;
--purple:#9d5cff;
--green:#22c55e;
--red:#ff426d;
--yellow:#f5c542
}

body{
min-height:100vh;
font-family:Arial,sans-serif;
color:var(--text);
background:
radial-gradient(circle at 10% 5%,rgba(0,217,255,.1),transparent 28%),
radial-gradient(circle at 90% 90%,rgba(157,92,255,.12),transparent 30%),
var(--bg)
}

button,
input,
select,
textarea{
font-family:inherit
}

button{
-webkit-tap-highlight-color:transparent
}

.app{
width:100%;
max-width:900px;
margin:auto;
padding:20px 18px 45px
}

.top{
display:flex;
align-items:center;
justify-content:space-between;
gap:15px;
margin-bottom:18px
}

.brand small{
font-size:9px;
letter-spacing:3px;
color:#687181
}

.brand h1{
font-size:28px;
margin-top:7px
}

.actions{
display:flex;
gap:8px
}

.topBtn{
width:46px;
height:46px;
border:1px solid var(--line);
border-radius:15px;
background:rgba(255,255,255,.045);
color:#fff;
font-size:18px;
cursor:pointer
}

.topBtn:active{
transform:scale(.94)
}

.adminBar{
display:flex;
align-items:center;
gap:12px;
padding:15px;
border:1px solid var(--line);
border-radius:20px;
background:rgba(255,255,255,.025);
margin-bottom:18px
}

.avatar{
width:43px;
height:43px;
display:flex;
align-items:center;
justify-content:center;
border-radius:14px;
background:linear-gradient(135deg,var(--cyan),var(--purple));
font-weight:800
}

.adminData{
flex:1;
min-width:0
}

.adminName{
font-size:13px;
font-weight:800;
word-break:break-word
}

.adminRole{
display:inline-block;
margin-top:4px;
padding:4px 8px;
border-radius:7px;
font-size:8px;
letter-spacing:1px;
color:var(--cyan);
background:rgba(0,217,255,.08);
border:1px solid rgba(0,217,255,.12)
}

.clock{
text-align:right
}

.clock strong{
display:block;
font-size:12px
}

.clock span{
display:block;
margin-top:3px;
font-size:9px;
color:#697384
}

.status{
display:flex;
align-items:center;
gap:8px;
font-size:10px;
color:#7f8999;
margin-bottom:18px
}

.statusDot{
width:8px;
height:8px;
border-radius:50%;
background:var(--green);
box-shadow:0 0 12px rgba(34,197,94,.6)
}

.panel{
border:1px solid var(--line);
background:rgba(12,17,25,.9);
border-radius:27px;
padding:22px;
box-shadow:0 25px 80px rgba(0,0,0,.4);
margin-bottom:18px
}

.panelHead{
display:flex;
justify-content:space-between;
align-items:center;
gap:15px;
margin-bottom:20px
}

.panelTitle{
font-size:18px;
font-weight:800
}

.panelSub{
font-size:11px;
color:var(--muted);
margin-top:5px;
line-height:1.5
}

.refresh{
border:1px solid var(--line);
background:rgba(255,255,255,.04);
color:#fff;
padding:10px 13px;
border-radius:12px;
cursor:pointer
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px
}

.field{
margin-bottom:16px
}

.full{
grid-column:1/-1
}

.label{
display:block;
font-size:10px;
letter-spacing:1px;
color:#858e9e;
margin-bottom:8px;
text-transform:uppercase
}

.input,
.select,
.textarea{
width:100%;
border:1px solid rgba(255,255,255,.1);
border-radius:15px;
background:rgba(255,255,255,.035);
outline:none;
padding:13px 15px;
color:#fff;
font-size:14px;
transition:.2s
}

.input,
.select{
height:52px
}

.textarea{
min-height:125px;
resize:vertical;
line-height:1.5
}

.select{
appearance:none
}

.select option{
background:#0c1119;
color:#fff
}

.input:focus,
.select:focus,
.textarea:focus{
border-color:var(--cyan);
box-shadow:0 0 0 3px rgba(0,217,255,.07)
}

.publish{
width:100%;
height:55px;
border:0;
border-radius:16px;
background:linear-gradient(135deg,var(--cyan),#6575ff);
color:#fff;
font-weight:800;
font-size:14px;
cursor:pointer;
box-shadow:0 12px 35px rgba(0,217,255,.15)
}

.publish:active{
transform:scale(.98)
}

.publish:disabled{
opacity:.5;
cursor:not-allowed
}

.message{
display:none;
padding:13px 15px;
border-radius:14px;
font-size:12px;
line-height:1.5;
margin-bottom:16px
}

.message.show{
display:block
}

.message.success{
border:1px solid rgba(34,197,94,.2);
background:rgba(34,197,94,.06);
color:#6ee7a0
}

.message.error{
border:1px solid rgba(255,66,109,.2);
background:rgba(255,66,109,.06);
color:#ff7895
}

.activity{
display:flex;
flex-direction:column;
gap:12px
}

.item{
padding:17px;
border:1px solid rgba(255,255,255,.07);
background:rgba(255,255,255,.025);
border-radius:19px
}

.itemTop{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
margin-bottom:10px
}

.badge{
font-size:9px;
letter-spacing:1px;
padding:6px 9px;
border-radius:8px;
background:rgba(0,217,255,.1);
color:var(--cyan);
text-transform:uppercase
}

.badge.maintenance{
color:var(--yellow);
background:rgba(245,197,66,.1)
}

.badge.request{
color:var(--purple);
background:rgba(157,92,255,.1)
}

.badge.update{
color:var(--cyan);
background:rgba(0,217,255,.1)
}

.date{
font-size:10px;
color:#697384;
text-align:right
}

.itemTitle{
font-size:15px;
font-weight:800;
margin-bottom:6px
}

.itemDesc{
font-size:12px;
color:#929baa;
line-height:1.55
}

.itemVersion{
display:inline-block;
margin-top:10px;
font-size:9px;
color:var(--purple);
letter-spacing:1px
}

.empty{
text-align:center;
padding:35px;
font-size:12px;
color:#697384;
border:1px dashed rgba(255,255,255,.08);
border-radius:18px
}

.footer{
text-align:center;
margin-top:20px;
font-size:9px;
letter-spacing:2px;
color:#343b47
}

@media(max-width:600px){

.grid{
grid-template-columns:1fr
}

.full{
grid-column:auto
}

.panel{
padding:18px
}

.brand h1{
font-size:25px
}

.clock{
display:none
}

.topBtn{
width:43px;
height:43px
}
}
</style>
</head>

<body>

<div class="app">

<div class="top">

<div class="brand">
<small>REYCLOUDSHOP ADMIN</small>
<h1>Control Panel</h1>
</div>

<div class="actions">

<button
class="topBtn"
id="dashboardBtn"
type="button"
>
←
</button>

<button
class="topBtn"
id="logoutBtn"
type="button"
>
↪
</button>

</div>

</div>

<div class="adminBar">

<div class="avatar" id="avatar">
?
</div>

<div class="adminData">

<div class="adminName" id="adminName">
Loading...
</div>

<div class="adminRole" id="adminRole">
Loading...
</div>

</div>

<div class="clock">

<strong id="clock">
00:00:00
</strong>

<span id="date">
Loading...
</span>

</div>

</div>

<div class="status">

<div class="statusDot"></div>

Admin Control Online

</div>

<div class="panel">

<div class="panelHead">

<div>

<div class="panelTitle">
Publish Activity
</div>

<div class="panelSub">
Update yang dibuat di sini akan tampil pada Activity user.
</div>

</div>

</div>

<div class="message" id="message"></div>

<div class="grid">

<div class="field">

<label class="label">
Kategori
</label>

<select class="select" id="type">

<option value="update">
Update
</option>

<option value="request">
Request
</option>

<option value="maintenance">
Maintenance
</option>

</select>

</div>

<div class="field">

<label class="label">
Version
</label>

<input
class="input"
id="version"
type="text"
placeholder="v1.2.0"
maxlength="30"
>

</div>

<div class="field full">

<label class="label">
Judul
</label>

<input
class="input"
id="title"
type="text"
placeholder="Contoh: Dashboard UI diperbarui"
maxlength="150"
>

</div>

<div class="field full">

<label class="label">
Deskripsi
</label>

<textarea
class="textarea"
id="description"
placeholder="Tulis informasi update untuk user..."
maxlength="1000"
></textarea>

</div>

<div class="field">

<label class="label">
Tanggal
</label>

<input
class="input"
id="date"
type="date"
>

</div>

<div class="field">

<label class="label">
Jam
</label>

<input
class="input"
id="time"
type="time"
>

</div>

</div>

<button
class="publish"
id="publishBtn"
type="button"
>
🚀 Publish Activity
</button>

</div>

<div class="panel">

<div class="panelHead">

<div>

<div class="panelTitle">
Activity Terbaru
</div>

<div class="panelSub">
Activity tersimpan di MongoDB.
</div>

</div>

<button
class="refresh"
id="refreshBtn"
type="button"
>
↻ Refresh
</button>

</div>

<div
class="activity"
id="activityList"
>

<div class="empty">
Memuat activity...
</div>

</div>

</div>

<div class="footer">
REYCLOUDSHOP ADMIN CONTROL
</div>

</div>

<script>
const adminName=document.getElementById("adminName");
const adminRole=document.getElementById("adminRole");
const avatar=document.getElementById("avatar");

const clock=document.getElementById("clock");
const dateElement=document.getElementById("date");

const typeInput=document.getElementById("type");
const versionInput=document.getElementById("version");
const titleInput=document.getElementById("title");
const descriptionInput=document.getElementById("description");
const dateInput=document.getElementById("date");
const timeInput=document.getElementById("time");

const publishBtn=document.getElementById("publishBtn");
const refreshBtn=document.getElementById("refreshBtn");
const activityList=document.getElementById("activityList");
const message=document.getElementById("message");

let currentUser=null;

function goDashboard(){
window.location.href="/dashboard/";
}

async function logout(){

try{

await fetch("/api/auth/logout",{
method:"POST",
credentials:"include",
headers:{
"Accept":"application/json"
}
});

}catch(error){

console.error(error);

}

window.location.href="/";

}

function updateClock(){

const now=new Date();

clock.textContent=
now.toLocaleTimeString("id-ID",{
hour:"2-digit",
minute:"2-digit",
second:"2-digit"
});

dateElement.textContent=
now.toLocaleDateString("id-ID",{
weekday:"long",
day:"2-digit",
month:"long",
year:"numeric"
});

}

function today(){

const now=new Date();

return[
now.getFullYear(),
String(now.getMonth()+1).padStart(2,"0"),
String(now.getDate()).padStart(2,"0")
].join("-");

}

function currentTime(){

const now=new Date();

return[
String(now.getHours()).padStart(2,"0"),
String(now.getMinutes()).padStart(2,"0")
].join(":");

}

function escapeHTML(value){

return String(value||"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

function showMessage(text,type){

message.textContent=text;

message.className=
`message show ${type}`;

}

function hideMessage(){

message.textContent="";

message.className="message";

}

async function requestAPI(url,options={}){

const response=
await fetch(url,{
...options,
credentials:"include",
headers:{
Accept:"application/json",
...(options.headers||{})
}
});

let data={};

try{

data=await response.json();

}catch{

data={};

}

if(response.status===401){

window.location.href="/";

throw new Error(
"Session login sudah berakhir."
);

}

if(response.status===403){

window.location.href="/dashboard/";

throw new Error(
"Akun tidak memiliki akses Admin."
);

}

if(!response.ok){

throw new Error(
data.error||
"Request gagal."
);

}

return data;

}

async function loadCurrentUser(){

try{

const data=
await requestAPI(
"/api/auth/me",
{
method:"GET",
cache:"no-store"
}
);

if(!data.user){

throw new Error(
"Data user tidak ditemukan."
);

}

currentUser=data.user;

const role=
String(currentUser.role||"")
.toLowerCase();

if(role!=="admin"){

window.location.href="/dashboard/";

return;

}

adminName.textContent=
currentUser.username;

adminRole.textContent=
role.toUpperCase();

avatar.textContent=
String(currentUser.username||"?")
.charAt(0)
.toUpperCase();

await loadActivity();

}catch(error){

console.error(error);

}

}

async function loadActivity(){

activityList.innerHTML=`
<div class="empty">
Memuat activity...
</div>
`;

try{

const data=
await requestAPI(
"/api/activity",
{
method:"GET",
cache:"no-store"
}
);

const activities=
Array.isArray(data.activities)
?data.activities
:[];

if(!activities.length){

activityList.innerHTML=`
<div class="empty">
Belum ada activity.
</div>
`;

return;

}

activityList.innerHTML=
activities.map(item=>{

const category=
String(item.type||"update")
.toLowerCase();

return`

<div class="item">

<div class="itemTop">

<div class="badge ${escapeHTML(category)}">
${escapeHTML(category)}
</div>

<div class="date">
${escapeHTML(item.date||"")}
${item.time?
" · "+escapeHTML(item.time):
""}
</div>

</div>

<div class="itemTitle">
${escapeHTML(item.title)}
</div>

<div class="itemDesc">
${escapeHTML(item.description)}
</div>

${item.version?`

<div class="itemVersion">
VERSION ${escapeHTML(item.version)}
</div>

`:""}

</div>

`;

}).join("");

}catch(error){

activityList.innerHTML=`
<div class="empty">
${escapeHTML(error.message)}
</div>
`;

}

}

async function publishActivity(){

hideMessage();

const title=
titleInput.value.trim();

const description=
descriptionInput.value.trim();

const version=
versionInput.value.trim();

if(!title){

showMessage(
"Judul activity wajib diisi.",
"error"
);

return;

}

if(!description){

showMessage(
"Deskripsi activity wajib diisi.",
"error"
);

return;

}

publishBtn.disabled=true;
publishBtn.textContent=
"⏳ Publishing...";

try{

await requestAPI(
"/api/admin/activity",
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({

type:typeInput.value,
title,
description,
version,
date:dateInput.value,
time:timeInput.value

})
}
);

showMessage(
"✅ Activity berhasil dipublish.",
"success"
);

titleInput.value="";
descriptionInput.value="";
versionInput.value="";

dateInput.value=today();
timeInput.value=currentTime();

await loadActivity();

}catch(error){

showMessage(
"❌ "+error.message,
"error"
);

}finally{

publishBtn.disabled=false;

publishBtn.textContent=
"🚀 Publish Activity";

}

}

document
.getElementById("dashboardBtn")
.addEventListener(
"click",
goDashboard
);

document
.getElementById("logoutBtn")
.addEventListener(
"click",
logout
);

publishBtn.addEventListener(
"click",
publishActivity
);

refreshBtn.addEventListener(
"click",
loadActivity
);

dateInput.value=today();
timeInput.value=currentTime();

updateClock();

setInterval(
updateClock,
1000
);

loadCurrentUser();
</script>

</body>
</html>
