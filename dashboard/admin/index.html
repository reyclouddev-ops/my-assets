<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Admin Control - ReyCloudShop</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent
}

:root{
--bg:#05070b;
--card:#0c1119;
--card2:#101722;
--line:rgba(255,255,255,.08);
--text:#f5f7fb;
--muted:#747d8d;
--cyan:#00d9ff;
--purple:#9d5cff;
--green:#22c55e;
--orange:#ff9d42;
--red:#ff426d
}

body{
min-height:100vh;
background:
radial-gradient(circle at 5% 0%,rgba(0,217,255,.12),transparent 30%),
radial-gradient(circle at 95% 100%,rgba(157,92,255,.12),transparent 30%),
var(--bg);
font-family:Arial,sans-serif;
color:var(--text)
}

.app{
width:100%;
max-width:900px;
margin:auto;
padding:24px 18px 50px
}

.top{
display:flex;
align-items:center;
justify-content:space-between;
margin-bottom:25px
}

.brand small{
font-size:10px;
letter-spacing:3px;
color:#687181
}

.brand h1{
font-size:30px;
margin-top:7px
}

.back{
width:50px;
height:50px;
border-radius:16px;
border:1px solid var(--line);
background:rgba(255,255,255,.04);
color:white;
font-size:23px;
cursor:pointer
}

.info{
padding:18px;
border:1px solid rgba(0,217,255,.14);
border-radius:22px;
background:rgba(0,217,255,.035);
margin-bottom:20px
}

.infoTop{
display:flex;
align-items:center;
gap:12px
}

.adminIcon{
width:45px;
height:45px;
display:flex;
align-items:center;
justify-content:center;
border-radius:14px;
background:rgba(0,217,255,.1);
font-size:22px
}

.infoTitle{
font-weight:800;
font-size:14px
}

.infoText{
font-size:11px;
color:var(--muted);
margin-top:4px
}

.clock{
margin-top:15px;
font-size:11px;
color:#626b7b
}

.panel{
padding:22px;
border:1px solid var(--line);
border-radius:25px;
background:rgba(12,17,25,.9);
box-shadow:0 25px 70px rgba(0,0,0,.3);
margin-bottom:20px
}

.panelHead{
display:flex;
align-items:center;
justify-content:space-between;
margin-bottom:20px
}

.panelTitle{
font-size:17px;
font-weight:800
}

.panelSub{
font-size:10px;
color:var(--muted);
margin-top:5px
}

.refresh{
width:40px;
height:40px;
border-radius:12px;
border:1px solid var(--line);
background:rgba(255,255,255,.04);
color:white;
cursor:pointer
}

.label{
display:block;
font-size:10px;
letter-spacing:1.5px;
color:#737d8d;
margin:17px 0 8px
}

.input,
.textarea,
.select{
width:100%;
border:1px solid rgba(255,255,255,.09);
border-radius:15px;
background:rgba(255,255,255,.035);
color:white;
outline:none;
font-family:Arial,sans-serif;
font-size:13px;
transition:.2s
}

.input,
.select{
height:53px;
padding:0 15px
}

.textarea{
min-height:120px;
padding:15px;
resize:vertical
}

.input:focus,
.textarea:focus,
.select:focus{
border-color:var(--cyan);
box-shadow:0 0 0 3px rgba(0,217,255,.07)
}

.select option{
background:#101722;
color:white
}

.publish{
width:100%;
height:55px;
margin-top:20px;
border:0;
border-radius:16px;
background:linear-gradient(135deg,#00d9ff,#6575ff);
color:white;
font-weight:800;
font-size:14px;
cursor:pointer;
box-shadow:0 12px 30px rgba(0,217,255,.14);
transition:.2s
}

.publish:active{
transform:scale(.98)
}

.publish:disabled{
opacity:.45;
cursor:not-allowed
}

.message{
display:none;
margin-top:15px;
padding:13px 15px;
border-radius:14px;
font-size:12px;
line-height:1.5
}

.message.show{
display:block
}

.message.success{
border:1px solid rgba(34,197,94,.2);
background:rgba(34,197,94,.05);
color:#6ee7a0
}

.message.error{
border:1px solid rgba(255,66,109,.2);
background:rgba(255,66,109,.05);
color:#ff7895
}

.activity{
display:flex;
align-items:flex-start;
gap:13px;
padding:17px 0;
border-bottom:1px solid rgba(255,255,255,.055)
}

.activity:last-child{
border-bottom:0
}

.activityIcon{
width:42px;
height:42px;
flex-shrink:0;
display:flex;
align-items:center;
justify-content:center;
border-radius:13px;
background:rgba(0,217,255,.08);
font-size:18px
}

.activityContent{
flex:1;
min-width:0
}

.activityTop{
display:flex;
align-items:center;
justify-content:space-between;
gap:10px
}

.badge{
font-size:8px;
font-weight:800;
letter-spacing:1px;
padding:5px 8px;
border-radius:7px;
background:rgba(0,217,255,.1);
color:var(--cyan)
}

.badge.maintenance{
background:rgba(255,157,66,.1);
color:var(--orange)
}

.badge.request{
background:rgba(157,92,255,.1);
color:var(--purple)
}

.badge.fix{
background:rgba(34,197,94,.1);
color:var(--green)
}

.activityDate{
font-size:9px;
color:#596170
}

.activityTitle{
font-size:14px;
font-weight:800;
margin-top:9px
}

.activityDescription{
font-size:11px;
line-height:1.6;
color:#7e8796;
margin-top:5px
}

.activityMeta{
font-size:9px;
color:#596170;
margin-top:9px
}

.delete{
width:38px;
height:38px;
flex-shrink:0;
border:1px solid rgba(255,66,109,.12);
border-radius:11px;
background:rgba(255,66,109,.06);
color:#ff6684;
cursor:pointer
}

.empty{
padding:35px 10px;
text-align:center;
color:var(--muted);
font-size:12px
}

.emptyIcon{
font-size:30px;
margin-bottom:10px
}

.loading{
padding:30px;
text-align:center;
color:var(--muted);
font-size:11px
}

.footer{
text-align:center;
font-size:9px;
letter-spacing:2px;
color:#343b47;
margin-top:25px
}

@media(max-width:500px){
.app{
padding:20px 14px 40px
}

.brand h1{
font-size:27px
}

.panel{
padding:18px;
border-radius:22px
}

.activity{
gap:10px
}

.activityDate{
display:none
}
}
</style>
</head>

<body>

<div class="app">

<div class="top">

<div class="brand">
<small>REYCLOUDSHOP</small>
<h1>Admin Control</h1>
</div>

<button class="back" onclick="history.back()">←</button>

</div>

<div class="info">

<div class="infoTop">

<div class="adminIcon">
👑
</div>

<div>
<div class="infoTitle">
Activity Control
</div>

<div class="infoText">
Kelola pembaruan yang tampil kepada user.
</div>
</div>

</div>

<div class="clock" id="clock">
Memuat waktu...
</div>

</div>

<div class="panel">

<div class="panelHead">

<div>
<div class="panelTitle">
🚀 Publish Activity
</div>

<div class="panelSub">
Buat pembaruan baru untuk user.
</div>
</div>

</div>

<label class="label">
CATEGORY
</label>

<select class="select" id="type">

<option value="update">
Update
</option>

<option value="maintenance">
Maintenance
</option>

<option value="request">
Request
</option>

<option value="fix">
Fix
</option>

</select>

<label class="label">
TITLE
</label>

<input
class="input"
id="title"
type="text"
maxlength="120"
placeholder="Contoh: Dashboard UI diperbarui"
>

<label class="label">
DESCRIPTION
</label>

<textarea
class="textarea"
id="description"
maxlength="1000"
placeholder="Tulis informasi pembaruan..."
></textarea>

<label class="label">
VERSION
</label>

<input
class="input"
id="version"
type="text"
maxlength="50"
placeholder="Contoh: v2.1.0"
>

<button
class="publish"
id="publish"
>
🚀 Publish Update
</button>

<div
class="message"
id="message"
></div>

</div>

<div class="panel">

<div class="panelHead">

<div>
<div class="panelTitle">
📋 Activity History
</div>

<div class="panelSub">
Update yang sudah dipublikasikan.
</div>
</div>

<button
class="refresh"
id="refresh"
>
↻
</button>

</div>

<div id="activityList">

<div class="loading">
⏳ Memuat activity...
</div>

</div>

</div>

<div class="footer">
REYCLOUDSHOP ADMIN CONTROL
</div>

</div>

<script>
const API="/api/activity";

const typeInput=
document.getElementById("type");

const titleInput=
document.getElementById("title");

const descriptionInput=
document.getElementById("description");

const versionInput=
document.getElementById("version");

const publishButton=
document.getElementById("publish");

const refreshButton=
document.getElementById("refresh");

const message=
document.getElementById("message");

const activityList=
document.getElementById("activityList");

const clock=
document.getElementById("clock");

let activities=[];

function updateClock(){

const now=new Date();

clock.textContent=
now.toLocaleDateString(
"id-ID",
{
weekday:"long",
day:"2-digit",
month:"long",
year:"numeric"
}
)+
" • "+
now.toLocaleTimeString(
"id-ID",
{
hour:"2-digit",
minute:"2-digit",
second:"2-digit",
hour12:false
}
);

}

function escapeHTML(value){

return String(value||"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

function formatDate(value){

const date=new Date(value);

return date.toLocaleDateString(
"id-ID",
{
day:"2-digit",
month:"short",
year:"numeric"
}
);

}

function getIcon(type){

const icons={
update:"🚀",
maintenance:"🛠️",
request:"💡",
fix:"🔧"
};

return icons[type]||"📌";

}

function showMessage(
text,
type
){

message.textContent=text;

message.className=
`message show ${type}`;

setTimeout(()=>{
message.classList.remove("show");
},4000);

}

function renderActivities(){

if(!activities.length){

activityList.innerHTML=`
<div class="empty">
<div class="emptyIcon">📭</div>
Belum ada activity.
</div>
`;

return;

}

activityList.innerHTML="";

activities.forEach(item=>{

const element=
document.createElement("div");

element.className="activity";

element.innerHTML=`

<div class="activityIcon">
${getIcon(item.type)}
</div>

<div class="activityContent">

<div class="activityTop">

<span class="badge ${escapeHTML(item.type)}">
${escapeHTML(item.type).toUpperCase()}
</span>

<span class="activityDate">
${formatDate(item.createdAt)}
</span>

</div>

<div class="activityTitle">
${escapeHTML(item.title)}
</div>

<div class="activityDescription">
${escapeHTML(item.description)}
</div>

<div class="activityMeta">
🕐 ${new Date(item.createdAt).toLocaleTimeString(
"id-ID",
{
hour:"2-digit",
minute:"2-digit"
}
)}
${item.version
?` • ${escapeHTML(item.version)}`
:""}
</div>

</div>

<button
class="delete"
data-id="${escapeHTML(item.id)}"
>
×
</button>

`;

activityList.appendChild(element);

});

document
.querySelectorAll(".delete")
.forEach(button=>{

button.addEventListener(
"click",
()=>deleteActivity(
button.dataset.id
)
);

});

}

async function loadActivities(){

activityList.innerHTML=`
<div class="loading">
⏳ Memuat activity...
</div>
`;

try{

const response=
await fetch(API,{
method:"GET",
headers:{
Accept:"application/json"
}
});

const data=
await response.json();

if(
!response.ok||
!data.success
){

throw new Error(
data.error||
"Gagal mengambil activity."
);

}

activities=
Array.isArray(data.activities)
?data.activities
:[];

renderActivities();

}catch(error){

activityList.innerHTML=`
<div class="empty">
<div class="emptyIcon">⚠️</div>
${escapeHTML(error.message)}
</div>
`;

}

}

async function publishActivity(){

const type=
typeInput.value;

const title=
titleInput.value.trim();

const description=
descriptionInput.value.trim();

const version=
versionInput.value.trim();

if(!title){

showMessage(
"Judul activity wajib diisi.",
"error"
);

titleInput.focus();

return;

}

if(!description){

showMessage(
"Deskripsi activity wajib diisi.",
"error"
);

descriptionInput.focus();

return;

}

publishButton.disabled=true;

publishButton.textContent=
"⏳ Publishing...";

try{

const response=
await fetch(API,{

method:"POST",

headers:{
"Content-Type":
"application/json",
Accept:
"application/json"
},

body:JSON.stringify({
type,
title,
description,
version
})

});

const data=
await response.json();

if(
!response.ok||
!data.success
){

throw new Error(
data.error||
"Gagal membuat activity."
);

}

titleInput.value="";
descriptionInput.value="";
versionInput.value="";

showMessage(
"✅ Activity berhasil dipublikasikan.",
"success"
);

await loadActivities();

}catch(error){

showMessage(
"❌ "+
(error.message||
"Gagal publish activity."),
"error"
);

}finally{

publishButton.disabled=false;

publishButton.textContent=
"🚀 Publish Update";

}

}

async function deleteActivity(id){

if(!id){
return;
}

const confirmed=
window.confirm(
"Yakin ingin menghapus activity ini?"
);

if(!confirmed){
return;
}

try{

const response=
await fetch(API,{

method:"DELETE",

headers:{
"Content-Type":
"application/json",
Accept:
"application/json"
},

body:JSON.stringify({
id
})

});

const data=
await response.json();

if(
!response.ok||
!data.success
){

throw new Error(
data.error||
"Gagal menghapus activity."
);

}

showMessage(
"🗑️ Activity berhasil dihapus.",
"success"
);

await loadActivities();

}catch(error){

showMessage(
"❌ "+
(error.message||
"Gagal menghapus activity."),
"error"
);

}

}

publishButton.addEventListener(
"click",
publishActivity
);

refreshButton.addEventListener(
"click",
loadActivities
);

updateClock();

setInterval(
updateClock,
1000
);

loadActivities();
</script>

</body>
</html>
