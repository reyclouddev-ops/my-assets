<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ReyCloudShop - Deploy</title>
<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent
}

:root{
--bg:#05070b;
--card:#0c1119;
--card2:#101722;
--line:rgba(255,255,255,.08);
--muted:#747d8d;
--text:#f5f7fb;
--cyan:#00d9ff;
--purple:#9d5cff;
--green:#22c55e;
--red:#ff426d
}

body{
min-height:100vh;
background:
radial-gradient(circle at 10% 5%,rgba(0,217,255,.1),transparent 28%),
radial-gradient(circle at 90% 90%,rgba(157,92,255,.1),transparent 30%),
var(--bg);
font-family:Arial,sans-serif;
color:var(--text)
}

.app{
width:100%;
max-width:760px;
margin:auto;
padding:30px 20px 40px
}

.top{
display:flex;
align-items:center;
justify-content:space-between;
margin-bottom:28px
}

.brand small{
font-size:11px;
letter-spacing:3px;
color:#687181
}

.brand h1{
font-size:34px;
margin-top:8px
}

.back{
width:54px;
height:54px;
border-radius:17px;
border:1px solid var(--line);
background:rgba(255,255,255,.04);
color:white;
font-size:25px;
cursor:pointer
}

.panel{
padding:28px;
border:1px solid var(--line);
border-radius:30px;
background:rgba(12,17,25,.88);
box-shadow:0 30px 90px rgba(0,0,0,.45)
}

.drop{
min-height:250px;
border:1px dashed rgba(0,217,255,.35);
border-radius:25px;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
text-align:center;
padding:25px;
cursor:pointer;
transition:.25s
}

.drop:hover,
.drop.drag{
border-color:var(--cyan);
background:rgba(0,217,255,.035)
}

.cloud{
font-size:55px;
margin-bottom:15px
}

.drop h2{
font-size:23px;
margin-bottom:9px
}

.drop p{
color:var(--muted);
font-size:13px;
line-height:1.6
}

#fileInput{
display:none
}

.file{
display:none;
align-items:center;
gap:15px;
padding:15px;
margin-top:18px;
border-radius:20px;
border:1px solid var(--line);
background:rgba(255,255,255,.035)
}

.file.show{
display:flex
}

.fileIcon{
width:50px;
height:50px;
border-radius:15px;
display:flex;
align-items:center;
justify-content:center;
font-size:25px;
background:rgba(0,217,255,.1)
}

.fileInfo{
flex:1;
min-width:0
}

.fileName{
font-weight:700;
font-size:14px;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis
}

.fileSize{
font-size:12px;
color:var(--muted);
margin-top:5px
}

.remove{
width:40px;
height:40px;
border:0;
border-radius:13px;
background:rgba(255,60,100,.1);
color:#ff5478;
font-size:18px;
cursor:pointer
}

.label{
display:block;
font-size:12px;
letter-spacing:1px;
color:#858e9e;
margin:27px 0 9px
}

.input{
width:100%;
height:56px;
border:1px solid rgba(255,255,255,.1);
border-radius:17px;
background:rgba(255,255,255,.035);
outline:none;
padding:0 17px;
color:white;
font-size:15px;
transition:.2s
}

.input:focus{
border-color:var(--cyan);
box-shadow:0 0 0 3px rgba(0,217,255,.08)
}

.deployBtn{
width:100%;
height:58px;
margin-top:18px;
border:0;
border-radius:18px;
background:linear-gradient(135deg,#00d9ff,#6575ff);
color:white;
font-size:16px;
font-weight:800;
cursor:pointer;
box-shadow:0 12px 35px rgba(0,217,255,.16);
transition:.2s
}

.deployBtn:active{
transform:scale(.98)
}

.deployBtn:disabled{
opacity:.45;
cursor:not-allowed;
box-shadow:none
}

.progressBox{
display:none;
margin-top:25px;
padding:20px;
border-radius:22px;
border:1px solid var(--line);
background:rgba(255,255,255,.025)
}

.progressBox.show{
display:block
}

.progressTop{
display:flex;
align-items:center;
justify-content:space-between;
margin-bottom:12px
}

.progressTitle{
font-size:14px;
font-weight:700
}

.progressPercent{
font-size:13px;
color:var(--cyan);
font-weight:800
}

.progress{
height:9px;
background:#171d27;
border-radius:20px;
overflow:hidden
}

.progressBar{
width:0%;
height:100%;
border-radius:20px;
background:linear-gradient(90deg,#00d9ff,#9d5cff);
transition:width .4s ease
}

.stage{
font-size:11px;
color:#626b7b;
margin-top:12px;
text-transform:uppercase;
letter-spacing:1px
}

.message{
font-size:13px;
color:#a7afbd;
margin-top:6px;
line-height:1.5
}

.result{
display:none;
margin-top:20px;
padding:20px;
border-radius:22px;
border:1px solid rgba(34,197,94,.2);
background:rgba(34,197,94,.035)
}

.result.show{
display:block
}

.resultTitle{
font-size:17px;
font-weight:800;
margin-bottom:15px
}

.resultItem{
padding:13px 0;
border-bottom:1px solid rgba(255,255,255,.06)
}

.resultItem:last-child{
border-bottom:0
}

.resultLabel{
font-size:10px;
color:#626b7b;
text-transform:uppercase;
letter-spacing:1px;
margin-bottom:5px
}

.resultValue{
font-size:13px;
word-break:break-word
}

.result a{
color:var(--cyan);
text-decoration:none
}

.error{
display:none;
margin-top:20px;
padding:15px;
border-radius:17px;
border:1px solid rgba(255,66,109,.2);
background:rgba(255,66,109,.05);
color:#ff7b98;
font-size:13px;
line-height:1.5
}

.error.show{
display:block
}

.footer{
text-align:center;
margin-top:25px;
font-size:10px;
letter-spacing:2px;
color:#343b47
}

@media(max-width:500px){
.app{
padding:22px 15px 35px
}

.brand h1{
font-size:30px
}

.panel{
padding:18px;
border-radius:25px
}

.drop{
min-height:235px
}

.back{
width:48px;
height:48px
}
}
</style>
</head>

<body>

<div class="app">

<div class="top">
<div class="brand">
<small>REYCLOUDSHOP</small>
<h1>Deploy Project</h1>
</div>

<button class="back" onclick="history.back()">←</button>
</div>

<div class="panel">

<div class="drop" id="dropZone">
<div class="cloud">☁️</div>
<h2>Upload Project</h2>
<p>Tap untuk memilih file atau drag & drop project kamu</p>
<p>ZIP, HTML, HTM · Maksimal 20 MB</p>
</div>

<input
type="file"
id="fileInput"
accept=".zip,.html,.htm"
>

<div class="file" id="fileBox">
<div class="fileIcon">📦</div>

<div class="fileInfo">
<div class="fileName" id="fileName">-</div>
<div class="fileSize" id="fileSize">-</div>
</div>

<button class="remove" id="removeFile">×</button>
</div>

<label class="label">PROJECT HOSTNAME</label>

<input
class="input"
id="projectName"
type="text"
placeholder="contoh: reyshop"
autocomplete="off"
>

<button
class="deployBtn"
id="deployBtn"
disabled
>
🚀 Deploy ke Vercel
</button>

<div class="progressBox" id="progressBox">

<div class="progressTop">
<div class="progressTitle" id="progressTitle">
Menyiapkan deployment...
</div>

<div class="progressPercent" id="progressPercent">
0%
</div>
</div>

<div class="progress">
<div class="progressBar" id="progressBar"></div>
</div>

<div class="stage" id="stage">
PREPARE
</div>

<div class="message" id="progressMessage">
Menunggu...
</div>

</div>

<div class="result" id="result">

<div class="resultTitle">
🎉 Deployment Berhasil
</div>

<div class="resultItem">
<div class="resultLabel">Project</div>
<div class="resultValue" id="resultProject">-</div>
</div>

<div class="resultItem">
<div class="resultLabel">Framework</div>
<div class="resultValue" id="resultFramework">-</div>
</div>

<div class="resultItem">
<div class="resultLabel">Files</div>
<div class="resultValue" id="resultFiles">-</div>
</div>

<div class="resultItem">
<div class="resultLabel">Vercel</div>
<div class="resultValue">
<a id="resultVercel" href="#" target="_blank">-</a>
</div>
</div>

<div class="resultItem" id="customDomainRow">
<div class="resultLabel">Custom Domain</div>
<div class="resultValue">
<a id="resultDomain" href="#" target="_blank">-</a>
</div>
</div>

</div>

<div class="error" id="errorBox"></div>

</div>

<div class="footer">
POWERED BY REYCLOUDSHOP
</div>

</div>

<script>
const dropZone=document.getElementById("dropZone");
const fileInput=document.getElementById("fileInput");
const fileBox=document.getElementById("fileBox");
const fileName=document.getElementById("fileName");
const fileSize=document.getElementById("fileSize");
const removeFile=document.getElementById("removeFile");
const projectName=document.getElementById("projectName");
const deployBtn=document.getElementById("deployBtn");
const progressBox=document.getElementById("progressBox");
const progressBar=document.getElementById("progressBar");
const progressPercent=document.getElementById("progressPercent");
const progressTitle=document.getElementById("progressTitle");
const progressMessage=document.getElementById("progressMessage");
const stage=document.getElementById("stage");
const result=document.getElementById("result");
const errorBox=document.getElementById("errorBox");

let selectedFile=null;
const MAX_SIZE=20*1024*1024;

function formatBytes(bytes){
if(!bytes)return"0 B";

const units=["B","KB","MB","GB"];
let size=bytes;
let index=0;

while(size>=1024&&index<units.length-1){
size/=1024;
index++;
}

return`${size.toFixed(2)} ${units[index]}`;
}

function cleanProjectName(value){
return String(value||"")
.trim()
.toLowerCase()
.replace(/\.(zip|html?)$/i,"")
.replace(/[^a-z0-9-]/g,"-")
.replace(/-+/g,"-")
.replace(/^-|-$/g,"");
}

function validProjectName(value){
return/^[a-z0-9][a-z0-9-]{1,62}$/.test(value);
}

function validate(){
const name=cleanProjectName(projectName.value);

deployBtn.disabled=!(
selectedFile&&
validProjectName(name)
);
}

function showFile(file){
if(!file)return;

const name=file.name.toLowerCase();
const allowed=[
".zip",
".html",
".htm"
];

const valid=allowed.some(ext=>name.endsWith(ext));

if(!valid){
showError("Format file harus ZIP, HTML, atau HTM.");
return;
}

if(file.size>MAX_SIZE){
showError("Ukuran file maksimal 20 MB.");
return;
}

selectedFile=file;

fileName.textContent=file.name;
fileSize.textContent=formatBytes(file.size);

fileBox.classList.add("show");

errorBox.classList.remove("show");

validate();
}

function clearFile(){
selectedFile=null;
fileInput.value="";
fileBox.classList.remove("show");
validate();
}

function showError(message){
errorBox.textContent="❌ "+message;
errorBox.classList.add("show");
}

function hideError(){
errorBox.classList.remove("show");
}

function updateProgress(data){
const percent=Math.max(
0,
Math.min(
100,
Number(data.progress||0)
)
);

progressBox.classList.add("show");

progressBar.style.width=`${percent}%`;
progressPercent.textContent=`${percent}%`;

progressTitle.textContent=
data.message||
"Memproses deployment...";

progressMessage.textContent=
data.message||
"Harap tunggu...";

stage.textContent=
String(data.stage||"processing").toUpperCase();
}

function showResult(data){
result.classList.add("show");

document.getElementById("resultProject").textContent=
data.projectName||"-";

document.getElementById("resultFramework").textContent=
data.framework||"-";

document.getElementById("resultFiles").textContent=
data.files||"-";

const vercel=document.getElementById("resultVercel");

if(data.vercelUrl){
vercel.href=data.vercelUrl;
vercel.textContent=data.vercelUrl;
}else{
vercel.removeAttribute("href");
vercel.textContent="-";
}

const domainRow=document.getElementById("customDomainRow");
const domain=document.getElementById("resultDomain");

if(data.customDomain){
domainRow.style.display="block";
domain.href=data.customDomain;
domain.textContent=data.customDomain;
}else{
domainRow.style.display="none";
}
}

async function readStream(response){
if(!response.body){
throw new Error("Browser tidak mendukung response streaming.");
}

const reader=response.body.getReader();
const decoder=new TextDecoder();
let buffer="";

while(true){

const{
value,
done
}=await reader.read();

if(done)break;

buffer+=decoder.decode(
value,
{
stream:true
}
);

const lines=buffer.split("\n");

buffer=lines.pop()||"";

for(const line of lines){

const text=line.trim();

if(!text)continue;

try{

const data=JSON.parse(text);

if(data.type==="progress"){
updateProgress(data);
}

if(data.type==="complete"){
updateProgress(data);
showResult(data);
}

if(data.type==="error"){
throw new Error(
data.message||
"Deployment gagal."
);
}

}catch(error){
if(error instanceof SyntaxError){
continue;
}
throw error;
}

}
}

if(buffer.trim()){

try{

const data=JSON.parse(buffer);

if(data.type==="complete"){
updateProgress(data);
showResult(data);
}

if(data.type==="error"){
throw new Error(
data.message||
"Deployment gagal."
);
}

}catch(error){

if(!(error instanceof SyntaxError)){
throw error;
}

}

}
}

async function deploy(){
hideError();
result.classList.remove("show");

const name=cleanProjectName(projectName.value);

if(!selectedFile){
showError("Pilih file project terlebih dahulu.");
return;
}

if(!validProjectName(name)){
showError(
"Hostname tidak valid. Gunakan huruf kecil, angka, dan tanda -."
);
return;
}

projectName.value=name;

deployBtn.disabled=true;
deployBtn.textContent="⏳ Deploying...";

progressBox.classList.add("show");
progressBar.style.width="0%";
progressPercent.textContent="0%";
progressTitle.textContent="Menyiapkan deployment...";
stage.textContent="PREPARE";
progressMessage.textContent="Mengirim project ke server...";

const formData=new FormData();

formData.append(
"projectName",
name
);

formData.append(
"file",
selectedFile,
selectedFile.name
);

try{

const response=await fetch(
"/api/deploy",
{
method:"POST",
body:formData,
headers:{
Accept:"application/x-ndjson"
}
}
);

if(!response.ok){

let message=
`Server error ${response.status}`;

try{
const data=await response.json();
message=data.error||message;
}catch{}

throw new Error(message);
}

await readStream(response);

}catch(error){

console.error(error);

showError(
error.message||
"Deployment gagal."
);

progressTitle.textContent="Deployment gagal";
stage.textContent="ERROR";

}catch(error){

showError(
error.message||
"Terjadi kesalahan."
);

}finally{

deployBtn.disabled=false;
deployBtn.textContent="🚀 Deploy ke Vercel";

validate();

}
}

dropZone.addEventListener(
"click",
()=>{
fileInput.click();
}
);

fileInput.addEventListener(
"change",
event=>{
showFile(event.target.files[0]);
}
);

removeFile.addEventListener(
"click",
event=>{
event.stopPropagation();
clearFile();
}
);

dropZone.addEventListener(
"dragover",
event=>{
event.preventDefault();
dropZone.classList.add("drag");
}
);

dropZone.addEventListener(
"dragleave",
()=>{
dropZone.classList.remove("drag");
}
);

dropZone.addEventListener(
"drop",
event=>{
event.preventDefault();
dropZone.classList.remove("drag");

const file=
event.dataTransfer.files[0];

showFile(file);
}
);

projectName.addEventListener(
"input",
()=>{
const cleaned=cleanProjectName(
projectName.value
);

if(projectName.value!==cleaned){
projectName.value=cleaned;
}

validate();
}
);

deployBtn.addEventListener(
"click",
deploy
);

projectName.addEventListener(
"keydown",
event=>{
if(event.key==="Enter"&&!deployBtn.disabled){
deploy();
}
}
);
</script>

</body>
</html>
