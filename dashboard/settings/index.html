<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ReyCloudShop - Settings</title>
<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent
}

:root{
--bg:#07080d;
--card:#10131c;
--line:rgba(255,255,255,.08);
--text:#f5f7fb;
--muted:#747b8b;
--cyan:#00d9ff;
--purple:#8b5cf6;
--red:#ff426d;
--green:#22c55e
}

body{
min-height:100vh;
font-family:Arial,sans-serif;
color:var(--text);
background:
radial-gradient(circle at 10% 10%,rgba(0,217,255,.1),transparent 28%),
radial-gradient(circle at 90% 90%,rgba(139,92,246,.12),transparent 30%),
var(--bg)
}

.app{
width:100%;
max-width:700px;
margin:auto;
padding:25px 18px 40px
}

.header{
display:flex;
align-items:center;
gap:15px;
margin-bottom:25px
}

.back{
width:48px;
height:48px;
border:1px solid var(--line);
border-radius:16px;
background:rgba(255,255,255,.05);
color:#fff;
font-size:22px;
cursor:pointer
}

.header small{
display:block;
font-size:10px;
letter-spacing:2px;
color:var(--muted)
}

.header h1{
font-size:27px;
margin-top:6px
}

.card{
border:1px solid var(--line);
border-radius:27px;
padding:24px;
background:rgba(16,19,28,.88);
box-shadow:0 25px 70px rgba(0,0,0,.4);
margin-bottom:18px
}

.profile{
display:flex;
align-items:center;
gap:16px;
padding-bottom:22px;
border-bottom:1px solid var(--line)
}

.avatar{
width:65px;
height:65px;
display:flex;
align-items:center;
justify-content:center;
border-radius:21px;
background:linear-gradient(135deg,var(--cyan),var(--purple));
font-size:25px;
font-weight:800
}

.profileData{
min-width:0;
flex:1
}

.username{
font-size:19px;
font-weight:800;
word-break:break-word
}

.role{
display:inline-flex;
margin-top:7px;
padding:5px 10px;
border-radius:9px;
background:rgba(0,217,255,.08);
border:1px solid rgba(0,217,255,.12);
color:var(--cyan);
font-size:10px;
font-weight:700;
text-transform:uppercase
}

.sectionTitle{
font-size:16px;
font-weight:800;
margin-bottom:6px
}

.sectionDesc{
font-size:12px;
line-height:1.5;
color:var(--muted);
margin-bottom:20px
}

.field{
margin-bottom:17px
}

.label{
display:block;
font-size:11px;
color:#858c9b;
letter-spacing:1px;
margin-bottom:8px;
text-transform:uppercase
}

.inputWrap{
position:relative
}

.input{
width:100%;
height:54px;
padding:0 50px 0 16px;
border:1px solid var(--line);
border-radius:16px;
background:rgba(255,255,255,.035);
outline:none;
color:#fff;
font-size:14px;
transition:.2s
}

.input:focus{
border-color:var(--cyan);
box-shadow:0 0 0 3px rgba(0,217,255,.07)
}

.eye{
position:absolute;
right:7px;
top:7px;
width:40px;
height:40px;
border:0;
border-radius:12px;
background:transparent;
color:#7d8493;
font-size:18px;
cursor:pointer
}

.button{
width:100%;
height:55px;
border:0;
border-radius:16px;
background:linear-gradient(135deg,var(--cyan),var(--purple));
color:#fff;
font-weight:800;
font-size:14px;
cursor:pointer;
transition:.2s
}

.button:active{
transform:scale(.98)
}

.button:disabled{
opacity:.5;
cursor:not-allowed
}

.message{
display:none;
margin-bottom:18px;
padding:14px;
border-radius:15px;
font-size:12px;
line-height:1.5
}

.message.show{
display:block
}

.message.success{
color:#5ee895;
border:1px solid rgba(34,197,94,.2);
background:rgba(34,197,94,.06)
}

.message.error{
color:#ff7794;
border:1px solid rgba(255,66,109,.2);
background:rgba(255,66,109,.06)
}

.info{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px
}

.infoBox{
padding:16px;
border:1px solid var(--line);
border-radius:17px;
background:rgba(255,255,255,.025)
}

.infoLabel{
font-size:9px;
color:#626a79;
letter-spacing:1px;
text-transform:uppercase
}

.infoValue{
margin-top:7px;
font-size:13px;
font-weight:700;
word-break:break-word
}

.footer{
text-align:center;
font-size:9px;
letter-spacing:2px;
color:#3d4350;
margin-top:25px
}

@media(max-width:450px){
.card{
padding:19px;
border-radius:23px
}

.info{
grid-template-columns:1fr
}
}
</style>
</head>

<body>

<div class="app">

<div class="header">
<button class="back" onclick="location.href='/dashboard/'">←</button>

<div>
<small>REYCLOUDSHOP</small>
<h1>Settings</h1>
</div>
</div>

<div class="card">

<div class="profile">

<div class="avatar" id="avatar">R</div>

<div class="profileData">

<div class="username" id="username">
ReyCloud
</div>

<div class="role" id="role">
User
</div>

</div>

</div>

<div style="height:22px"></div>

<div class="sectionTitle">
Profile
</div>

<div class="sectionDesc">
Informasi akun yang sedang digunakan.
</div>

<div class="info">

<div class="infoBox">
<div class="infoLabel">Username</div>
<div class="infoValue" id="infoUsername">-</div>
</div>

<div class="infoBox">
<div class="infoLabel">Role</div>
<div class="infoValue" id="infoRole">-</div>
</div>

</div>

</div>

<div class="card">

<div class="sectionTitle">
🔐 Change Password
</div>

<div class="sectionDesc">
Gunakan password baru yang kuat untuk menjaga keamanan akun.
</div>

<div class="message" id="message"></div>

<div class="field">

<label class="label">
Current Password
</label>

<div class="inputWrap">

<input
class="input"
id="currentPassword"
type="password"
placeholder="Password saat ini"
autocomplete="current-password"
>

<button
class="eye"
type="button"
onclick="togglePassword('currentPassword',this)"
>
👁
</button>

</div>

</div>

<div class="field">

<label class="label">
New Password
</label>

<div class="inputWrap">

<input
class="input"
id="newPassword"
type="password"
placeholder="Password baru"
autocomplete="new-password"
>

<button
class="eye"
type="button"
onclick="togglePassword('newPassword',this)"
>
👁
</button>

</div>

</div>

<div class="field">

<label class="label">
Confirm Password
</label>

<div class="inputWrap">

<input
class="input"
id="confirmPassword"
type="password"
placeholder="Ulangi password baru"
autocomplete="new-password"
>

<button
class="eye"
type="button"
onclick="togglePassword('confirmPassword',this)"
>
👁
</button>

</div>

</div>

<button
class="button"
id="changeButton"
onclick="changePassword()"
>
🔒 Simpan Password
</button>

</div>

<div class="footer">
POWERED BY REYCLOUDSHOP
</div>

</div>

<script>
const usernameElement=document.getElementById("username");
const roleElement=document.getElementById("role");
const avatarElement=document.getElementById("avatar");
const infoUsername=document.getElementById("infoUsername");
const infoRole=document.getElementById("infoRole");
const message=document.getElementById("message");
const changeButton=document.getElementById("changeButton");

function getUser(){
const username=
localStorage.getItem("reycloud_username")||"ReyCloud";

const role=
localStorage.getItem("reycloud_role")||"User";

usernameElement.textContent=username;
roleElement.textContent=role;
infoUsername.textContent=username;
infoRole.textContent=role;

avatarElement.textContent=
username.charAt(0).toUpperCase();
}

function togglePassword(id,button){
const input=document.getElementById(id);

if(input.type==="password"){
input.type="text";
button.textContent="🙈";
}else{
input.type="password";
button.textContent="👁";
}
}

function showMessage(text,type){
message.textContent=text;
message.className=`message show ${type}`;
}

async function changePassword(){

const currentPassword=
document.getElementById("currentPassword").value;

const newPassword=
document.getElementById("newPassword").value;

const confirmPassword=
document.getElementById("confirmPassword").value;

if(!currentPassword||!newPassword||!confirmPassword){
showMessage(
"Semua password wajib diisi.",
"error"
);
return;
}

if(newPassword.length<8){
showMessage(
"Password baru minimal 8 karakter.",
"error"
);
return;
}

if(newPassword!==confirmPassword){
showMessage(
"Konfirmasi password tidak cocok.",
"error"
);
return;
}

changeButton.disabled=true;
changeButton.textContent="⏳ Menyimpan...";

try{

const response=await fetch(
"/api/auth/change-password",
{
method:"POST",
headers:{
"Content-Type":"application/json",
"Accept":"application/json"
},
body:JSON.stringify({
username:
localStorage.getItem("reycloud_username"),
currentPassword,
newPassword
})
}
);

const data=await response.json();

if(!response.ok||!data.success){
throw new Error(
data.error||"Gagal mengubah password."
);
}

document.getElementById("currentPassword").value="";
document.getElementById("newPassword").value="";
document.getElementById("confirmPassword").value="";

showMessage(
"✅ Password berhasil diperbarui.",
"success"
);

}catch(error){

showMessage(
"❌ "+(error.message||"Terjadi kesalahan."),
"error"
);

}finally{

changeButton.disabled=false;
changeButton.textContent="🔒 Simpan Password";

}

}

getUser();
</script>

</body>
</html>
