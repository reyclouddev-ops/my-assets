<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>ReyCloudShop — Authentication</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
--bg:#05070b;
--card:rgba(12,17,25,.95);
--line:rgba(255,255,255,.08);
--text:#f7f9fc;
--muted:#7f8999;
--cyan:#00d9ff;
--blue:#5b7cff;
--purple:#a05cff;
--red:#ff5577;
--green:#22c55e
}

*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent
}

html{
width:100%;
min-height:100%;
background:var(--bg)
}

body{
width:100%;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:18px;
font-family:Inter,Arial,sans-serif;
color:var(--text);
background:
radial-gradient(circle at 10% 10%,rgba(0,217,255,.13),transparent 30%),
radial-gradient(circle at 90% 90%,rgba(160,92,255,.14),transparent 32%),
var(--bg);
overflow-x:hidden
}

button,
input{
font-family:inherit
}

button{
-webkit-user-select:none;
user-select:none
}

.bg-orb{
position:fixed;
width:420px;
height:420px;
border-radius:50%;
background:
radial-gradient(
circle,
rgba(0,217,255,.12),
transparent 68%
);
filter:blur(35px);
pointer-events:none;
animation:float 10s ease-in-out infinite alternate
}

@keyframes float{
from{
transform:translate(-100px,-80px)
}
to{
transform:translate(100px,80px)
}
}

.auth{
width:100%;
max-width:430px;
position:relative;
z-index:2
}

.brand{
text-align:center;
margin-bottom:18px
}

.brand small{
font-size:10px;
letter-spacing:4px;
color:#687384
}

.brand h1{
font-size:27px;
margin-top:7px;
font-weight:800;
letter-spacing:-.8px
}

.banner{
height:145px;
border:1px solid var(--line);
border-radius:25px;
overflow:hidden;
margin-bottom:18px;
position:relative;
background:#101722;
box-shadow:0 20px 55px rgba(0,0,0,.35)
}

.banner img{
width:100%;
height:100%;
display:block;
object-fit:cover
}

.banner:after{
content:"";
position:absolute;
inset:0;
background:
linear-gradient(
180deg,
transparent 35%,
rgba(5,7,11,.7)
)
}

.bannerText{
position:absolute;
left:18px;
bottom:15px;
z-index:2
}

.bannerText strong{
display:block;
font-size:16px
}

.bannerText span{
display:block;
margin-top:4px;
font-size:11px;
color:#c2c9d4
}

.scene{
width:100%;
height:470px;
perspective:1500px
}

.card{
width:100%;
height:100%;
position:relative;
transform-style:preserve-3d;
transition:
transform .8s cubic-bezier(.6,-.28,.735,.045)
}

.card.flipped{
transform:rotateY(180deg)
}

.face{
position:absolute;
inset:0;
padding:28px;
border:1px solid var(--line);
border-radius:30px;
background:var(--card);
backdrop-filter:blur(20px);
-webkit-backdrop-filter:blur(20px);
box-shadow:0 30px 80px rgba(0,0,0,.5);
backface-visibility:hidden;
-webkit-backface-visibility:hidden;
display:flex;
flex-direction:column
}

.back{
transform:rotateY(180deg)
}

.icon{
width:55px;
height:55px;
border-radius:18px;
display:flex;
align-items:center;
justify-content:center;
font-size:25px;
background:
linear-gradient(
135deg,
rgba(0,217,255,.14),
rgba(91,124,255,.14)
);
border:1px solid rgba(0,217,255,.15);
margin-bottom:18px
}

h2{
font-size:25px;
letter-spacing:-.5px
}

.subtitle{
color:var(--muted);
font-size:12px;
line-height:1.6;
margin-top:7px;
margin-bottom:25px
}

.inputBox{
position:relative;
margin-bottom:14px
}

.inputBox span{
position:absolute;
left:16px;
top:50%;
transform:translateY(-50%);
font-size:16px;
opacity:.75;
pointer-events:none
}

.inputBox input{
width:100%;
height:54px;
padding:0 16px 0 45px;
border:1px solid var(--line);
border-radius:16px;
background:rgba(255,255,255,.035);
color:#fff;
font-size:14px;
outline:none;
transition:.2s
}

.inputBox input::placeholder{
color:#596272
}

.inputBox input:focus{
border-color:rgba(0,217,255,.65);
box-shadow:
0 0 0 3px rgba(0,217,255,.07)
}

.action{
width:100%;
height:55px;
border:0;
border-radius:16px;
margin-top:5px;
font-weight:800;
font-size:14px;
cursor:pointer;
color:#031015;
background:
linear-gradient(
135deg,
var(--cyan),
var(--blue)
);
box-shadow:
0 13px 30px rgba(0,217,255,.14);
transition:.2s
}

.action:active{
transform:scale(.98)
}

.action:disabled{
opacity:.5;
cursor:not-allowed;
transform:none
}

.switch{
margin-top:auto;
text-align:center;
font-size:12px;
color:#697383
}

.switch button{
border:0;
background:none;
color:var(--cyan);
font-weight:700;
cursor:pointer;
font-size:12px
}

.status{
display:none;
margin-top:14px;
padding:12px 14px;
border-radius:14px;
font-size:11px;
line-height:1.5;
border:1px solid rgba(255,85,119,.2);
background:rgba(255,85,119,.06);
color:#ff829c
}

.status.show{
display:block
}

.status.success{
border-color:rgba(34,197,94,.2);
background:rgba(34,197,94,.06);
color:#6ee79a
}

.footer{
text-align:center;
font-size:9px;
letter-spacing:2px;
color:#353d49;
margin-top:16px
}

.loading{
position:fixed;
inset:0;
z-index:999;
display:flex;
align-items:center;
justify-content:center;
background:#05070b;
color:#7f8999;
font-size:12px;
letter-spacing:.5px;
transition:.25s
}

.loading.hidden{
opacity:0;
pointer-events:none
}

.loader{
display:flex;
flex-direction:column;
align-items:center;
gap:12px
}

.spinner{
width:28px;
height:28px;
border-radius:50%;
border:2px solid rgba(255,255,255,.08);
border-top-color:var(--cyan);
animation:spin .8s linear infinite
}

@keyframes spin{
to{
transform:rotate(360deg)
}
}

@media(max-width:500px){

body{
padding:15px
}

.brand h1{
font-size:24px
}

.banner{
height:125px;
border-radius:21px
}

.scene{
height:455px
}

.face{
padding:23px;
border-radius:25px
}

}

@media(max-height:720px){

body{
align-items:flex-start;
padding-top:12px;
padding-bottom:12px
}

.banner{
height:110px
}

.scene{
height:425px
}

.face{
padding:20px
}

.icon{
width:48px;
height:48px;
font-size:22px;
margin-bottom:13px
}

.subtitle{
margin-bottom:17px
}

.inputBox{
margin-bottom:10px
}

.inputBox input{
height:49px
}

.action{
height:50px
}

}
</style>
</head>

<body>

<div class="bg-orb"></div>

<div class="loading" id="loading">

<div class="loader">

<div class="spinner"></div>

<span id="loadingText">
Memeriksa session...
</span>

</div>

</div>

<main class="auth">

<div class="brand">

<small>
REYCLOUDSHOP
</small>

<h1>
Welcome to ReyCloud
</h1>

</div>

<div class="banner">

<img
src="/image/banner.png"
alt="ReyCloud Banner"
>

<div class="bannerText">

<strong>
ReyCloudShop
</strong>

<span>
Digital cloud platform
</span>

</div>

</div>

<div class="scene">

<div class="card" id="authCard">

<section class="face front">

<div class="icon">
🔐
</div>

<h2>
Welcome Back
</h2>

<p class="subtitle">
Login untuk melanjutkan ke dashboard ReyCloud.
</p>

<div class="inputBox">

<span>
👤
</span>

<input
id="loginUsername"
type="text"
placeholder="Username"
autocomplete="username"
maxlength="32"
>

</div>

<div class="inputBox">

<span>
🔒
</span>

<input
id="loginPassword"
type="password"
placeholder="Password"
autocomplete="current-password"
>

</div>

<button
class="action"
id="loginButton"
type="button"
>
LOGIN
</button>

<div
class="status"
id="loginStatus"
></div>

<div class="switch">

Belum punya akun?

<button
type="button"
id="showRegister"
>
Register
</button>

</div>

</section>

<section class="face back">

<div class="icon">
✨
</div>

<h2>
Create Account
</h2>

<p class="subtitle">
Buat akun baru untuk mulai menggunakan ReyCloud.
</p>

<div class="inputBox">

<span>
👤
</span>

<input
id="registerUsername"
type="text"
placeholder="Username"
autocomplete="username"
maxlength="32"
>

</div>

<div class="inputBox">

<span>
🔒
</span>

<input
id="registerPassword"
type="password"
placeholder="Password"
autocomplete="new-password"
>

</div>

<div class="inputBox">

<span>
🔑
</span>

<input
id="registerPasswordConfirm"
type="password"
placeholder="Konfirmasi Password"
autocomplete="new-password"
>

</div>

<button
class="action"
id="registerButton"
type="button"
>
REGISTER
</button>

<div
class="status"
id="registerStatus"
></div>

<div class="switch">

Sudah punya akun?

<button
type="button"
id="showLogin"
>
Login
</button>

</div>

</section>

</div>

</div>

<div class="footer">
POWERED BY REYCLOUDSHOP
</div>

</main>

<script>
const authCard=
document.getElementById("authCard")

const loading=
document.getElementById("loading")

const loadingText=
document.getElementById("loadingText")

const loginButton=
document.getElementById("loginButton")

const registerButton=
document.getElementById("registerButton")

const loginStatus=
document.getElementById("loginStatus")

const registerStatus=
document.getElementById("registerStatus")

const loginUsername=
document.getElementById("loginUsername")

const loginPassword=
document.getElementById("loginPassword")

const registerUsername=
document.getElementById("registerUsername")

const registerPassword=
document.getElementById("registerPassword")

const registerPasswordConfirm=
document.getElementById(
"registerPasswordConfirm"
)

function hideLoading(){
loading.classList.add("hidden")
}

function showLogin(){
authCard.classList.remove("flipped")
clearStatus()
}

function showRegister(){
authCard.classList.add("flipped")
clearStatus()
}

function clearStatus(){

loginStatus.className="status"
loginStatus.textContent=""

registerStatus.className="status"
registerStatus.textContent=""

}

function setStatus(
element,
message,
success=false
){

element.textContent=message

element.className=
success
?"status show success"
:"status show"

}

async function parseResponse(
response
){

let result=null

try{
result=await response.json()
}catch{
throw new Error(
"Response server tidak valid."
)
}

if(
!response.ok||
!result||
!result.success
){

throw new Error(
result?.error||
"Request gagal."
)

}

return result

}

async function postAPI(
url,
data
){

const response=
await fetch(
url,
{
method:"POST",
headers:{
"Content-Type":
"application/json",
"Accept":
"application/json"
},
credentials:"include",
cache:"no-store",
body:JSON.stringify(data)
}
)

return parseResponse(response)

}

async function getCurrentUser(){

const response=
await fetch(
"/api/auth/me",
{
method:"GET",
headers:{
"Accept":
"application/json"
},
credentials:"include",
cache:"no-store"
}
)

const result=
await parseResponse(response)

if(
!result.user||
typeof result.user!=="object"
){

throw new Error(
"Data user tidak ditemukan."
)

}

if(
!result.user.username
){

throw new Error(
"Username tidak ditemukan."
)

}

if(
!result.user.role
){

throw new Error(
"Role tidak ditemukan."
)

}

return result.user

}

function redirectByRole(user){

const role=
String(
user.role||""
)
.trim()
.toLowerCase()

if(role==="admin"){

window.location.replace(
"/dashboard/admin/"
)

return

}

if(role==="user"){

window.location.replace(
"/dashboard/"
)

return

}

throw new Error(
"Role akun tidak dikenali."
)

}

async function checkExistingSession(){

try{

loadingText.textContent=
"Memeriksa session..."

const user=
await getCurrentUser()

loadingText.textContent=
"Session ditemukan..."

redirectByRole(user)

return

}catch{

hideLoading()

}

}

async function login(){

clearStatus()

const username=
loginUsername.value
.trim()
.toLowerCase()

const password=
loginPassword.value

if(!username){

setStatus(
loginStatus,
"Username wajib diisi."
)

loginUsername.focus()

return

}

if(!password){

setStatus(
loginStatus,
"Password wajib diisi."
)

loginPassword.focus()

return

}

loginButton.disabled=true

loginButton.textContent=
"LOGIN..."

try{

await postAPI(
"/api/auth/login",
{
username,
password
}
)

setStatus(
loginStatus,
"Login berhasil. Memeriksa akun...",
true
)

const user=
await getCurrentUser()

setStatus(
loginStatus,
`Login berhasil sebagai ${user.role}.`,
true
)

setTimeout(
()=>{
redirectByRole(user)
},
400
)

}catch(error){

setStatus(
loginStatus,
error.message||
"Login gagal."
)

}finally{

loginButton.disabled=false

loginButton.textContent=
"LOGIN"

}

}

async function register(){

clearStatus()

const username=
registerUsername.value
.trim()
.toLowerCase()

const password=
registerPassword.value

const confirm=
registerPasswordConfirm.value

if(!username){

setStatus(
registerStatus,
"Username wajib diisi."
)

registerUsername.focus()

return

}

if(!password){

setStatus(
registerStatus,
"Password wajib diisi."
)

registerPassword.focus()

return

}

if(!confirm){

setStatus(
registerStatus,
"Konfirmasi password wajib diisi."
)

registerPasswordConfirm.focus()

return

}

if(
!/^[a-z0-9_]{3,32}$/.test(
username
)
){

setStatus(
registerStatus,
"Username 3-32 karakter. Gunakan huruf kecil, angka, atau underscore."
)

registerUsername.focus()

return

}

if(password.length<6){

setStatus(
registerStatus,
"Password minimal 6 karakter."
)

registerPassword.focus()

return

}

if(password!==confirm){

setStatus(
registerStatus,
"Konfirmasi password tidak cocok."
)

registerPasswordConfirm.focus()

return

}

registerButton.disabled=true

registerButton.textContent=
"REGISTER..."

try{

await postAPI(
"/api/auth/register",
{
username,
password
}
)

setStatus(
registerStatus,
"Registrasi berhasil. Memeriksa akun...",
true
)

const user=
await getCurrentUser()

setStatus(
registerStatus,
`Akun berhasil dibuat sebagai ${user.role}.`,
true
)

setTimeout(
()=>{
redirectByRole(user)
},
400
)

}catch(error){

setStatus(
registerStatus,
error.message||
"Registrasi gagal."
)

}finally{

registerButton.disabled=false

registerButton.textContent=
"REGISTER"

}

}

document
.getElementById("showRegister")
.addEventListener(
"click",
showRegister
)

document
.getElementById("showLogin")
.addEventListener(
"click",
showLogin
)

loginButton.addEventListener(
"click",
login
)

registerButton.addEventListener(
"click",
register
)

loginPassword.addEventListener(
"keydown",
event=>{

if(
event.key==="Enter"
){

login()

}

})

registerPasswordConfirm
.addEventListener(
"keydown",
event=>{

if(
event.key==="Enter"
){

register()

}

})

registerUsername
.addEventListener(
"input",
()=>{

registerUsername.value=
registerUsername.value
.toLowerCase()
.replace(
/[^a-z0-9_]/g,
""
)

})

loginUsername
.addEventListener(
"input",
()=>{

loginUsername.value=
loginUsername.value
.toLowerCase()
})

checkExistingSession()
</script>

</body>
</html>
